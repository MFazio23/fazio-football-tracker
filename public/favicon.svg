<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient matching theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Glow Ring Gradient -->
    <linearGradient id="emeraldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Rich Football Leather Gradient -->
    <radialGradient id="leatherGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="85%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Leather Shadow Filter -->
    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container with Emerald Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#emeraldRing)" stroke-width="2.5" />

  <!-- Stadium Field Arc Accents -->
  <path d="M 6 32 A 26 26 0 0 1 58 32" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 12 32 A 20 20 0 0 1 52 32" fill="none" stroke="rgba(16, 185, 129, 0.1)" stroke-width="1.5"/>

  <!-- Tilted Football Shape centered at (32, 32) rotated -38deg -->
  <g transform="translate(32, 32) rotate(-38)" filter="url(#ballGlow)">
    <!-- Main Ball Body (Pro-style pointed oval) -->
    <path d="M -22 0 C -14 -13, 14 -13, 22 0 C 14 13, -14 13, -22 0 Z" fill="url(#leatherGrad)" stroke="#431407" stroke-width="0.8"/>

    <!-- Left & Right White Grip Stripes -->
    <path d="M -15 -8.5 C -13.5 -5, -13.5 5, -15 8.5" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 15 -8.5 C 13.5 -5, 13.5 5, 15 8.5" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

    <!-- Center Long Seam -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>

    <!-- White Center Laces -->
    <line x1="-7.5" y1="-4.5" x2="-7.5" y2="4.5" stroke="#f8fafc" stroke-width="1.9" stroke-linecap="round"/>
    <line x1="-2.5" y1="-4.5" x2="-2.5" y2="4.5" stroke="#f8fafc" stroke-width="1.9" stroke-linecap="round"/>
    <line x1="2.5" y1="-4.5" x2="2.5" y2="4.5" stroke="#f8fafc" stroke-width="1.9" stroke-linecap="round"/>
    <line x1="7.5" y1="-4.5" x2="7.5" y2="4.5" stroke="#f8fafc" stroke-width="1.9" stroke-linecap="round"/>

    <!-- Top Highlight sheen -->
    <path d="M -16 -4 C -8 -10, 8 -10, 16 -4" fill="none" stroke="#fed7aa" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- Live Pulse Accent Dot (Top Right) -->
  <circle cx="51" cy="13" r="3.5" fill="#10b981" />
  <circle cx="51" cy="13" r="5.5" fill="none" stroke="#34d399" stroke-width="1" opacity="0.75" />
</svg>